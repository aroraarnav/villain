[project]
name = "villain"
version = "0.1.0"
description = "Profile poker opponents from hand histories: exploitative buckets, priced leaks and a skill rating that survives small samples"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.6",
]

[project.scripts]
villain = "villain.cli:main"
villain-ui = "villain.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["villain*"]

# The UI's page, stylesheet and script live beside the package as data files,
# not importable modules. Without this they are left out of a wheel, and the
# in-browser build (villain.webapp.browser) would import a UI it cannot serve.
[tool.setuptools.package-data]
"villain.webapp" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# The source is deliberately hand-formatted; line length is not enforced.
line-length = 200

[tool.ruff.lint]
# Correctness and hygiene, not style policing: pyflakes, a slice of pycodestyle,
# import ordering, bugbear, comprehension and modernization checks.
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line length: the code is hand-wrapped, not machine-formatted
    "E741",  # ambiguous names: the maths uses deliberate single letters (m, s, l)
    "B008",  # function calls in argument defaults: intentional in a few CLIs
    "B905",  # zip() strict=: each call needs its own length judgment, not a sweep
]
